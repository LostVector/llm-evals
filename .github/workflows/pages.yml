name: Sync references and publish Pages
on:
  push:
    branches: [main]
  schedule:
    - cron: '23 8 * * *'
  workflow_dispatch:
    inputs:
      sync:
        description: Refresh public upstream tables before publishing
        type: boolean
        default: true
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python3 -m unittest discover -s tests -v
      - name: Refresh public tables
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.sync)
        run: python3 scripts/sync_frontier.py
      - run: python3 evals.py validate
      - run: python3 scripts/build_site.py
      - name: Commit changed snapshots
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.sync)
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/frontier/
          if ! git diff --cached --quiet; then
            git commit -m "Refresh public benchmark reference snapshots"
            git push origin HEAD:main
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
